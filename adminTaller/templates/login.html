```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - {{ tipo }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        {% if tipo_login == "admin" %}
                            <div class="fs-1">⚙️</div>
                        {% else %}
                            <div class="fs-1">🔧</div>
                        {% endif %}

                        <h2 class="fw-bold">{{ tipo }}</h2>
                        <p class="text-muted">
                            Ingrese sus credenciales
                        </p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username"
                                   class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                required
                                autofocus
                            >
                        </div>

                        <div class="mb-4">
                            <label for="password"
                                   class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 btn-lg">
                            Ingresar
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'inicio' %}"
                           class="text-decoration-none">
                            ← Volver al inicio
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
```
